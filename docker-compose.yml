version: '3.8'

services:
  # Redis - брокер сообщений для Celery
  redis:
    image: redis:7-alpine
    container_name: table_booking_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Celery Worker - обработка асинхронных задач
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: table_booking_celery_worker
    command: celery -A reservation_System worker -l info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=host.docker.internal  # Подключение к PostgreSQL на host машине
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Beat - планировщик периодических задач
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: table_booking_celery_beat
    command: celery -A reservation_System beat -l info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=host.docker.internal
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Flower - веб-интерфейс для мониторинга Celery
  flower:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: table_booking_flower
    # ВАЖНО: используем отдельный бинарник flower, а не "celery flower"
    command: flower --broker=redis://redis:6379/0 --port=5555
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=host.docker.internal
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
